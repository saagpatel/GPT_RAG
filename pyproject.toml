[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "gpt-rag"
version = "0.1.0"
description = "Local-only personal RAG scaffold for macOS."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
  { name = "Personal project scaffold" },
]
dependencies = [
  "beautifulsoup4>=4.15.0",
  "fastapi>=0.139.0",
  "lancedb>=0.38.0",
  "lxml>=6.1.2",
  "ollama>=0.6.2",
  "platformdirs>=4.10.0",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.15.0",
  "pypdf>=6.13.2",
  "rich>=15.0.0",
  "typer>=0.26.8",
  "starlette>=1.3.1",
  "uvicorn>=0.52.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1",
  "pytest-mock>=3.15.1",
  "ruff>=0.15.21",
]
reranker = [
  "sentence-transformers>=6.0.1",
]
desktop = [
  "pyinstaller>=6.22.2",
]

[project.scripts]
gpt-rag = "gpt_rag.cli:main"
rag = "gpt_rag.cli:main"
gpt-rag-api = "gpt_rag.gui_api:main"
gpt-rag-worker = "gpt_rag.gui_worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gpt_rag"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
extend = "./ruff.toml"

[tool.ruff.lint]
extend-select = ["B"]
